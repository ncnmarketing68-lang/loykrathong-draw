<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->

    <!-- FontAwesome Icons -->

    <!-- Supabase JS SDK -->

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fffafc; color: #4a3b5c; }
        .krathong-gradient { background: linear-gradient(135deg, #fff5f7 0%, #fffbeb 50%, #fdf2f8 100%); }
        .card-glass { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border: 2px solid rgba(244, 114, 182, 0.25); box-shadow: 0 10px 30px rgba(236, 72, 153, 0.08); }
        .glow-pink { box-shadow: 0 0 25px rgba(244, 114, 182, 0.35); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.9; } }
        .animate-pulse-slow { animation: pulse-slow 2s infinite; }
        .marquee-container { overflow: hidden; width: 100%; display: flex; }
        .marquee-track { display: flex; gap: 1rem; width: max-content; animation: marquee 25s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fff0f5; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 4px; }
    </style>
</head>

        <div class="absolute bottom-20 left-1/4 text-3xl animate-float" style="animation-delay: 2s;">🕯️</div>

    <main id="app-container" class="flex-grow container mx-auto px-4 py-8 max-w-4xl z-10 flex flex-col items-center justify-center">
    </main>

    <footer class="w-full py-4 text-center text-xs text-purple-500 z-20 border-t border-pink-200/60 bg-white/60">

        <p class="mt-1"><a href="javascript:void(0)" onclick="openAdminLogin()" class="hover:text-pink-600 font-semibold underline">🔐 เข้าสู่ระบบผู้ดูแลระบบ (Admin)</a></p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://swgysrzfpyccjmlcjxtb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2EpxA5sfcozhic3RqcmYMA_Je7EQ...';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {}

        const BRANCHES = [
            { id: 'lansaka', name: 'วีแคร์ ลานสกา' },
            { id: 'nantachon1', name: 'นันท์ชนกฟาร์มา สาขาที่ 1' },
            { id: 'thaiwatsadu', name: 'ทีพี เฮลท์ สาขาไทวัสดุ' },
            { id: 'kokbok', name: 'วีแคร์ โคกบก' },
            { id: 'khaokhao', name: 'วีแคร์ เขาขาว' },
            { id: 'thaphae', name: 'วีแคร์ ท่าแพ' },
            { id: 'chanoknan', name: 'ชนกนันท์เภสัช' }
        ];

        const defaultRewards = [
            { id: 'r1', name: 'กระทงดอกไม้สด พรีเมียม', image: '🌸', weight: 20 },
            { id: 'r2', name: 'ร่ม UV ลายไทย', image: '🌂', weight: 20 },
            { id: 'r3', name: 'ผ้าขนหนู ลายพิเศษ', image: '🧺', weight: 20 },
            { id: 'r4', name: 'เสื้อกันฝน ลอยกระทง', image: '🧥', weight: 15 },
            { id: 'r5', name: 'ตะกร้าสานมงคล', image: '🧺', weight: 15 },
            { id: 'r6', name: 'กระเป๋าผ้ากระสอบไทย', image: '👜', weight: 10 }
        ];

        let rewards = JSON.parse(localStorage.getItem('ncn_krathong_rewards')) || defaultRewards;
        let branchInventories = JSON.parse(localStorage.getItem('ncn_krathong_inv')) || {};
        BRANCHES.forEach(b => {
            if (!branchInventories[b.id]) branchInventories[b.id] = {};
            rewards.forEach(r => {
                if (!branchInventories[b.id][r.id]) {
                    branchInventories[b.id][r.id] = { stock: 15, active: true };
                }
            });
        });

        let currentView = 'home';
        let selectedBranch = BRANCHES[0].id;
        let customerData = { name: '', phone: '' };
        let currentAdminRole = null;
        let adminTab = 'stock';

        async function fetchCloudDraws(phone) {
            if (!supabaseClient) return { count: 0, history: [] };
            try {
                let { data, error } = await supabaseClient
                    .from('loykrathong_records')
                    .select('*')
                    .eq('phone', phone);
                
                if (!error && data) {
                    return {
                        count: data.length,
                        history: data.map(r => ({
                            id: r.id,
                            rewardName: r.reward_name,
                            branchName: r.branch_name,
                            time: r.time || 'ไม่ระบุ'
                        }))
                    };
                }
            } catch (err) {}
            return { count: 0, history: [] };
        }

        function getCustomerHistoryHTML(historyList) {
            if (!historyList || historyList.length === 0) return '';
            let html = '<div class="mt-4 text-left bg-pink-50 p-3 rounded-2xl border border-pink-200">';
            html += '<div class="text-xs font-bold text-pink-600 mb-2"><i class="fa-solid fa-clock-rotate-left mr-1"></i> ประวัติการลอยกระทงของคุณ:</div>';
            html += '<div class="space-y-2 max-h-40 overflow-y-auto pr-1">';
            historyList.forEach((h, index) => {
                html += `
                    <div class="text-xs text-gray-700 bg-white p-2.5 rounded-xl border border-pink-100 shadow-sm">
                        <div class="font-bold text-pink-600 mb-1">🎁 ครั้งที่ ${index + 1}: ${h.rewardName}</div>
                        <div class="text-[10px] text-gray-500 flex items-center mb-0.5"><i class="fa-solid fa-location-dot w-4 text-center mr-1 text-pink-400"></i> ${h.branchName}</div>
                        <div class="text-[10px] text-gray-400 flex items-center"><i class="fa-solid fa-clock w-4 text-center mr-1 text-pink-400"></i> ${h.time}</div>
                    </div>
                `;
            });
            html += '</div></div>';
            return html;
        }

        function showCustomAlert(title, message, callback = null) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 md:p-8 rounded-3xl max-w-sm w-full text-center glow-pink relative animate-pulse-slow bg-white">
                    <div class="text-6xl mb-3 animate-bounce">🌕</div>
                    <h3 class="text-xl font-bold text-pink-600 mb-2">${title}</h3>
                    <div class="text-sm text-gray-600 mb-6 leading-relaxed">${message}</div>
                    <button id="alert-ok-btn" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl hover:from-pink-600 glow-pink transition-all shadow-md">เข้าใจแล้ว ✨</button>
                </div>
            `;
            document.body.appendChild(modal);
            modal.querySelector('#alert-ok-btn').addEventListener('click', () => {
                modal.remove();
                if (callback) callback();
            });
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 250;
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                    } else {
                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                let { data: rewData } = await supabaseClient.from('loykrathong_rewards').select('*');
                if (rewData && rewData.length > 0) {
                    rewards = rewData.map(r => ({ id: r.id, name: r.name, image: r.image, weight: 15 }));
                    branchInventories = {};
                    BRANCHES.forEach(b => {
                        branchInventories[b.id] = {};
                        rewData.forEach(r => {
                            const sMap = r.stock_map || {};
                            const aMap = r.active_map || {};
                            branchInventories[b.id][r.id] = {
                                stock: sMap[b.id] !== undefined ? sMap[b.id] : 15,
                                active: aMap[b.id] !== undefined ? aMap[b.id] : true
                            };
                        });
                    });
                    localStorage.setItem('ncn_krathong_rewards', JSON.stringify(rewards));
                    localStorage.setItem('ncn_krathong_inv', JSON.stringify(branchInventories));
                }
                renderCurrentView();
            } catch (err) {}
        }

        async function saveRewardToSupabase(rewardId) {
            localStorage.setItem('ncn_krathong_rewards', JSON.stringify(rewards));
            localStorage.setItem('ncn_krathong_inv', JSON.stringify(branchInventories));
            if (!supabaseClient) return;

            const reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let stock_map = {}, active_map = {};
            BRANCHES.forEach(b => {
                stock_map[b.id] = branchInventories[b.id]?.[rewardId]?.stock ?? 15;
                active_map[b.id] = branchInventories[b.id]?.[rewardId]?.active ?? true;
            });

            try {
                await supabaseClient.from('loykrathong_rewards').upsert({
                    id: reward.id, name: reward.name, image: reward.image, stock_map, active_map
                });
            } catch (err) {}
        }

        if (supabaseClient) {
            supabaseClient.channel('public:loykrathong_records')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'loykrathong_records' }, () => { loadSupabaseData(); })
                .subscribe();
            supabaseClient.channel('public:loykrathong_rewards')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'loykrathong_rewards' }, () => { loadSupabaseData(); })
                .subscribe();
        }

        async function renderCurrentView() {
            const container = document.getElementById('app-container');
            if (!container) return;
            const scrollY = window.scrollY;

            if (currentView === 'home') {
                container.innerHTML = renderHomeHTML();
                attachHomeEvents();
            } else if (currentView === 'draw') {
                container.innerHTML = await renderDrawHTML();
            } else if (currentView === 'admin_login') {
                container.innerHTML = renderAdminLoginHTML();
                attachAdminLoginEvents();
            } else if (currentView === 'admin_dashboard') {
                container.innerHTML = await renderAdminDashboardHTML();
            }
            window.scrollTo(0, scrollY);
        }

        function goToHome() {
            currentView = 'home';
            renderCurrentView();
        }

        function renderHomeHTML() {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch) || BRANCHES[0];
            const activeRewards = (rewards || []).filter(r => branchInventories[selectedBranch]?.[r.id]?.active);
            let totalStock = 0;
            activeRewards.forEach(r => totalStock += (branchInventories[selectedBranch][r.id].stock || 0));

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-3xl glow-pink relative bg-white/95">
                    <div class="absolute top-4 left-4 text-2xl">🌸</div>
                    <div class="absolute top-4 right-4 text-2xl">🌕</div>
                    
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-pink-100 flex items-center justify-center text-3xl glow-pink animate-bounce shadow-inner">🌕</div>
                        <h2 class="text-2xl md:text-3xl font-bold text-pink-600">ลอยกระทง เสริมดวง ลุ้นโชค</h2>
                        <p class="text-purple-500 text-sm mt-1">🌸 NCN Medgroup เทศกาลลอยกระทง 🕯️</p>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-pink-600 mb-2">
                            <i class="fa-solid fa-store mr-2 text-pink-400"></i> 1. เลือกร้านสาขาที่คุณเข้ารับบริการ
                        </label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            ${BRANCHES.map(b => `
                                <button type="button" onclick="selectBranch('${b.id}')" class="p-3 rounded-2xl text-sm font-medium transition-all text-left truncate shadow-sm ${selectedBranch === b.id ? 'bg-gradient-to-r from-pink-500 to-rose-400 text-white glow-pink font-bold' : 'bg-pink-50/70 text-purple-700 hover:bg-pink-100 border border-pink-200'}">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${b.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-6 bg-pink-50/60 p-4 rounded-2xl border border-pink-200 shadow-inner">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-pink-600"><i class="fa-solid fa-gift mr-1 text-pink-400"></i> ของรางวัลสาขา: ${branchObj.name}</span>
                            <span class="text-xs text-purple-500 font-semibold">คงเหลือ ${totalStock} ชิ้น</span>
                        </div>
                        <div class="marquee-container py-2 cursor-pointer">
                            <div class="marquee-track">
                                ${activeRewards.concat(activeRewards).map(r => {
                                    const isImg = typeof r.image === 'string' && r.image.startsWith('data:image');
                                    return `
                                        <div onclick="showRewardDetail('${r.id}')" class="flex-shrink-0 w-32 bg-white border border-pink-200 rounded-2xl p-3 text-center shadow-sm hover:border-pink-500 transition-all">
                                            <div class="text-3xl mb-1 flex items-center justify-center h-10">
                                                ${isImg ? `<img src="${r.image}" class="w-10 h-10 object-cover rounded-xl">` : r.image}
                                            </div>
                                            <div class="text-xs font-semibold text-gray-700 truncate">${r.name}</div>
                                            <div class="text-[10px] text-pink-500 font-semibold mt-1">เหลือ ${branchInventories[selectedBranch][r.id].stock} ชิ้น</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <form id="customer-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-pink-600 mb-1">
                                    <i class="fa-solid fa-user mr-2 text-pink-400"></i> 2. ชื่อ-นามสกุล หรือชื่อเล่น
                                </label>
                                <input type="text" id="cust-name" required placeholder="เช่น คุณสมชาย" value="${customerData.name}" oninput="customerData.name = this.value" class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-pink-200 text-gray-700 text-sm focus:outline-none focus:border-pink-500 shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-pink-600 mb-1">
                                    <i class="fa-solid fa-phone mr-2 text-pink-400"></i> 3. เบอร์โทรศัพท์มือถือ (10 หลัก)
                                </label>
                                <input type="tel" id="cust-phone" maxlength="10" required placeholder="08XXXXXXXX" value="${customerData.phone}" oninput="customerData.phone = this.value" class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-pink-200 text-gray-700 text-lg tracking-widest text-center focus:outline-none focus:border-pink-500 shadow-sm">

                    </div>
                </div>
            `;
        }

            selectedBranch = id;
            renderCurrentView();

        function showRewardDetail(rewardId) {
            const r = rewards.find(item => item.id === rewardId);
            if (!r) return;
            const inv = branchInventories[selectedBranch]?.[r.id] || { stock: 15 };

        function attachHomeEvents() {
            const form = document.getElementById('customer-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();
                const phoneRegex = /^0[689]\d{8}$/;
                if (!phoneRegex.test(phone)) {
                    showCustomAlert('เบอร์โทรไม่ถูกต้อง ❌', 'กรุณากรอกหมายเลขโทรศัพท์มือถือ 10 หลักให้ถูกต้อง<br>(ขึ้นต้นด้วย 06, 08 หรือ 09)');
                    return;
                }

                const btn = document.getElementById('btn-submit');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังตรวจสอบสิทธิ์จากคลาวด์...';
                btn.disabled = true;

                let cloudCheck = await fetchCloudDraws(phone);

                btn.disabled = false;
                btn.innerHTML = 'ลอยกระทงเสี่ยงทายโชคลาภ 🌕 ✨';

                if (cloudCheck.count >= 2) {
                    showCustomAlert('ใช้สิทธิ์ครบแล้ว! 🚫', `หมายเลขโทรศัพท์นี้ใช้สิทธิ์ลอยกระทงครบ 2 ครั้งแล้วครับ (ไม่สามารถสุ่มซ้ำได้)` + getCustomerHistoryHTML(cloudCheck.history));
                    return;
                }

                customerData = { name, phone };
                currentView = 'draw';
                renderCurrentView();
            });
        }

                            <p class="text-xs text-purple-400">เบอร์: ${customerData.phone} | สาขา: ${branchObj.name}</p>

                            <span class="text-xs text-purple-500">สิทธิ์ลอยกระทง:</span>
                            <span class="text-lg font-bold text-pink-600 ml-1">${remaining} ครั้ง</span>
                        </div>

        async function launchKrathong(num) {
            const loader = document.getElementById(`loader-${num}`);
            if (loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }

            let cloudCheck = await fetchCloudDraws(customerData.phone);
            if (loader) loader.classList.add('hidden');

            if (cloudCheck.count >= 2) {
                showCustomAlert('ใช้สิทธิ์ครบแล้ว! 🚫', 'คุณใช้สิทธิ์ครบ 2 ครั้งแล้วครับ (ไม่สามารถสุ่มซ้ำได้)' + getCustomerHistoryHTML(cloudCheck.history), () => { goToHome(); });
                return;
            }

            let available = rewards.filter(r => branchInventories[selectedBranch]?.[r.id]?.active && branchInventories[selectedBranch][r.id].stock > 0);
            if (available.length === 0) {
                showCustomAlert('ของรางวัลหมด! 📦', 'ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว');
                return;
            }

            let totalWeight = available.reduce((sum, r) => sum + r.weight, 0);
            let rand = Math.random() * totalWeight;
            let currentSum = 0;
            let won = available[0];
            for (let r of available) {
                currentSum += r.weight;
                if (rand <= currentSum) { won = r; break; }
            }

            const modal = document.createElement('div');
            modal.id = 'anim-modal';
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            modal.innerHTML = `
                <div class="card-glass p-8 rounded-3xl max-w-sm w-full bg-white glow-pink">
                    <div class="text-7xl mb-4 animate-bounce">🕯️🌊</div>
                    <h3 class="text-2xl font-bold text-pink-600 mb-2">กำลังลอยกระทงลงสู่สายน้ำ...</h3>
                    <p class="text-purple-500 text-sm italic mb-6 animate-pulse">"ขอให้ผลบุญหนุนนำ โชคลาภจงบังเกิด!"</p>
                    <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                </div>
            `;
            document.body.appendChild(modal);

            branchInventories[selectedBranch][won.id].stock -= 1;
            await saveRewardToSupabase(won.id);

            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const timeStr = new Date().toLocaleString('th-TH');

            if (supabaseClient) {
                try {
                    let newId = 'kr_' + Date.now() + Math.floor(Math.random() * 1000);
                    await supabaseClient.from('loykrathong_records').insert([{
                        id: newId, 
                        phone: customerData.phone, 
                        name: customerData.name,
                        branch_name: branchObj.name, 
                        reward_name: won.name, 
                        reward_image: (typeof won.image === 'string' ? won.image : ''), 
                        time: timeStr
                    }]);
                } catch(e) {}
            }

            setTimeout(async () => {
                document.getElementById('anim-modal')?.remove();
                let updatedCheck = await fetchCloudDraws(customerData.phone);
                showWinPopup(won, updatedCheck.count);
            }, 2000);
        }

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `

            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-sm w-full glow-pink text-center relative bg-white">
                    <h3 class="text-lg font-bold text-pink-600 mb-1">ระบุจำนวนสต็อก</h3>
                    <p class="text-xs text-purple-500 mb-4">${reward.name} (${branchObj.name})</p>
                    <input type="number" id="popup-stock-input" value="${inv.stock}" class="w-full px-4 py-3 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-center text-xl font-bold mb-4 focus:outline-none focus:border-pink-500 shadow-inner">
                    <div class="flex space-x-2">
                        <button id="popup-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">บันทึก</button>
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const input = modal.querySelector('#popup-stock-input');
            input.focus();
            input.select();

            modal.querySelector('#popup-save-btn').addEventListener('click', async () => {
                let val = parseInt(input.value);
                if (isNaN(val)) val = 0;
                inv.stock = Math.max(0, val);
                updateStockDOM(branchId, rewardId);
                modal.remove();
                await saveRewardToSupabase(rewardId);
            });
        }

        async function updateStock(bId, rId, amt) {
            branchInventories[bId][rId].stock = Math.max(0, branchInventories[bId][rId].stock + amt);
            updateStockDOM(bId, rId);
            await saveRewardToSupabase(rId);
        }

        async function toggleBranchReward(bId, rId) {
            let inv = branchInventories[bId][rId];
            inv.active = !inv.active;
            updateActiveDOM(bId, rId);
            await saveRewardToSupabase(rId);
        }

        function editRewardModal(rewardId) {
            let reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;
            let tempImage = reward.image;
            const isImg = typeof reward.image === 'string' && reward.image.startsWith('data:image');

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-md w-full glow-pink bg-white">
                    <h3 class="text-xl font-bold text-pink-600 mb-4"><i class="fa-solid fa-pen-to-square mr-2"></i> แก้ไขของรางวัล</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">ชื่อของรางวัล</label>
                            <input type="text" id="modal-reward-name" value="${reward.name}" class="w-full px-4 py-2.5 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-sm focus:outline-none focus:border-pink-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">อัปโหลดรูปภาพใหม่ หรือใส่อีโมจิ</label>
                            <div class="flex items-center space-x-3 mb-2">
                                <div id="modal-preview" class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border border-pink-200 shadow-inner">
                                    ${isImg ? `<img src="${reward.image}" class="w-full h-full object-cover">` : reward.image}
                                </div>
                                <div class="flex-1">
                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" value="${!isImg ? reward.image : ''}" placeholder="หรือใส่อีโมจิ เช่น 🌸" class="w-full px-3 py-2 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-xs focus:outline-none focus:border-pink-500">
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">บันทึก</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const newName = modal.querySelector('#modal-reward-name').value.trim();
                if (!newName) { showCustomAlert('แจ้งเตือน', 'กรุณากรอกชื่อของรางวัล'); return; }
                reward.name = newName;
                reward.image = tempImage;
                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(reward.id);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => modal.remove());
        }

        function addNewRewardModal() {
            let tempImage = '🌸';
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 rounded-3xl max-w-md w-full glow-pink bg-white">
                    <h3 class="text-xl font-bold text-pink-600 mb-4"><i class="fa-solid fa-plus-circle mr-2"></i> เพิ่มของรางวัลใหม่</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">ชื่อของรางวัล</label>
                            <input type="text" id="modal-reward-name" placeholder="เช่น กระเป๋าผ้าพรีเมียม" class="w-full px-4 py-2.5 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-sm focus:outline-none focus:border-pink-500 shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-pink-600 mb-1">อัปโหลดรูปภาพ หรือใส่อีโมจิ</label>
                            <div class="flex items-center space-x-3 mb-2">
                                <div id="modal-preview" class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center text-3xl overflow-hidden border border-pink-200 shadow-inner">🌸</div>
                                <div class="flex-1">
                                    <input type="file" id="modal-file-input" accept="image/*" class="w-full text-xs text-purple-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-500 file:text-white hover:file:bg-pink-600 cursor-pointer">
                                </div>
                            </div>
                            <input type="text" id="modal-emoji-input" placeholder="หรือใส่อีโมจิ เช่น 🌸" class="w-full px-3 py-2 rounded-2xl bg-pink-50 border border-pink-200 text-gray-700 text-xs focus:outline-none focus:border-pink-500">
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button id="modal-save-btn" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-2xl text-sm shadow-md">เพิ่มของรางวัล</button>
                            <button id="modal-cancel-btn" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-2xl text-sm">ยกเลิก</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const fileInput = modal.querySelector('#modal-file-input');
            const emojiInput = modal.querySelector('#modal-emoji-input');
            const preview = modal.querySelector('#modal-preview');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (compressedDataUrl) => {
                        tempImage = compressedDataUrl;
                        preview.innerHTML = `<img src="${tempImage}" class="w-full h-full object-cover">`;
                        emojiInput.value = '';
                    });
                }
            });

            emojiInput.addEventListener('input', (e) => {
                if (e.target.value.trim() !== '') {
                    tempImage = e.target.value.trim();
                    preview.innerHTML = tempImage;
                    fileInput.value = '';
                }
            });

            modal.querySelector('#modal-save-btn').addEventListener('click', async () => {
                const name = modal.querySelector('#modal-reward-name').value.trim();
                if (!name) { showCustomAlert('แจ้งเตือน', 'กรุณากรอกชื่อของรางวัล'); return; }
                let newId = 'r_' + Date.now();
                let newReward = { id: newId, name, image: tempImage, weight: 15 };
                
                rewards.push(newReward);
                BRANCHES.forEach(b => {
                    if (!branchInventories[b.id]) branchInventories[b.id] = {};
                    branchInventories[b.id][newId] = { stock: 15, active: true };
                });

                modal.remove();
                renderCurrentView();
                await saveRewardToSupabase(newId);
            });

            modal.querySelector('#modal-cancel-btn').addEventListener('click', () => modal.remove());
        }

        async function deleteReward(rewardId) {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบของรางวัลนี้ออกจากระบบ?')) {
                rewards = rewards.filter(r => r.id !== rewardId);
                localStorage.setItem('ncn_krathong_rewards', JSON.stringify(rewards));
                renderCurrentView();
                if (supabaseClient) await supabaseClient.from('loykrathong_rewards').delete().eq('id', rewardId);
            }
        }

        async function resetCustomerRights(phone) {
            if (confirm(`ต้องการรีเซ็ตสิทธิ์ของเบอร์ ${phone} ให้กลับเป็น 0 (สิทธิ์เต็ม 2 ครั้ง) หรือไม่?`)) {
                if (supabaseClient) {
                    await supabaseClient.from('loykrathong_records').delete().eq('phone', phone);
                }
                loadSupabaseData();
            }
        }

        renderCurrentView();
        loadSupabaseData();
    </script>
</body>
</html>
