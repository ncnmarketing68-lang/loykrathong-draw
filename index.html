<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCN Medgroup Loy Krathong Lucky Draw 🌕krathong✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #080b1e; color: #f3f4f6; }
        .krathong-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #0f0728 50%, #1a0524 100%); }
        .card-glass { background: rgba(30, 20, 60, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(234, 179, 8, 0.3); }
        .glow-gold { box-shadow: 0 0 25px rgba(234, 179, 8, 0.4); }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } }
        .animate-pulse-slow { animation: pulse-slow 2s infinite; }
        .marquee-container { overflow: hidden; width: 100%; display: flex; }
        .marquee-track { display: flex; gap: 1rem; width: max-content; animation: marquee 25s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0728; }
        ::-webkit-scrollbar-thumb { background: #eab308; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between krathong-gradient relative overflow-x-hidden">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
        <div class="absolute top-10 left-10 text-4xl animate-float">🌕</div>
        <div class="absolute top-1/4 right-12 text-4xl animate-float" style="animation-delay: 1s;">🌸</div>
        <div class="absolute bottom-20 left-1/4 text-3xl animate-float" style="animation-delay: 2s;">🕯️</div>
        <div class="absolute bottom-10 right-1/3 text-3xl animate-float" style="animation-delay: 1.5s;">✨</div>
    </div>

    <header class="w-full py-4 px-6 card-glass border-b border-yellow-500/20 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goToHome()">
            <div class="w-10 h-10 rounded-full bg-yellow-600 flex items-center justify-center glow-gold text-xl">🌕</div>
            <div>
                <h1 class="font-bold text-lg text-yellow-400">NCN Medgroup</h1>
                <p class="text-xs text-purple-300">LOY KRATHONG LUCKY DRAW 🌸🕯️</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 text-xs text-purple-300">
            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span>ระบบซิงก์คลาวด์ Realtime</span>
        </div>
    </header>

    <main id="app-container" class="flex-grow container mx-auto px-4 py-8 max-w-4xl z-10 flex flex-col items-center justify-center">
    </main>

    <footer class="w-full py-4 text-center text-xs text-purple-400/60 z-20 border-t border-purple-900/40">
        <p>© NCN Medgroup • เทศกาลลอยกระทงสุ่มของรางวัลออนไลน์ 7 สาขา</p>
        <p class="mt-1"><a href="javascript:void(0)" onclick="openAdminLogin()" class="hover:text-yellow-400 underline">เข้าสู่ระบบผู้ดูแลระบบ (Admin)</a></p>
    </footer>

    <script>
        // กำหนดค่าการเชื่อมต่อ Supabase ของคุณ
        const SUPABASE_URL = 'https://swgysrzfpyccjmlcjxtb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2EpxA5sfcozhic3RqcmYMA_Je7EQ...'; // ใส่คีย์เต็มของคุณตรงนี้
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {}

        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        const BRANCHES = [
            { id: 'lansaka', name: 'วีแคร์ ลานสกา' },
            { id: 'nantachon1', name: 'นันท์ชนกฟาร์มา สาขาที่ 1' },
            { id: 'thaiwatsadu', name: 'ทีพี เฮลท์ สาขาไทวัสดุ' },
            { id: 'kokbok', name: 'วีแคร์ โคกบก' },
            { id: 'khaokhao', name: 'วีแคร์ เขาขาว' },
            { id: 'thaphae', name: 'วีแคร์ ท่าแพ' },
            { id: 'chanoknan', name: 'ชนกนันท์เภสัช' }
        ];

        const defaultRewards = [
            { id: 'r1', name: 'กระทงดอกไม้สด พรีเมียม', image: '🌸', weight: 20 },
            { id: 'r2', name: 'ร่ม UV ลายไทย', image: '🌂', weight: 20 },
            { id: 'r3', name: 'ผ้าขนหนู ลายพิเศษ', image: '🧺', weight: 20 },
            { id: 'r4', name: 'เสื้อกันฝน ลอยกระทง', image: '🧥', weight: 15 },
            { id: 'r5', name: 'ตะกร้าสานมงคล', image: '🧺', weight: 15 },
            { id: 'r6', name: 'กระเป๋าผ้ากระสอบไทย', image: '👜', weight: 10 }
        ];

        let rewards = JSON.parse(localStorage.getItem('ncn_krathong_rewards')) || defaultRewards;
        let branchInventories = JSON.parse(localStorage.getItem('ncn_krathong_inv')) || {};
        BRANCHES.forEach(b => {
            if (!branchInventories[b.id]) branchInventories[b.id] = {};
            rewards.forEach(r => {
                if (!branchInventories[b.id][r.id]) {
                    branchInventories[b.id][r.id] = { stock: 15, active: true };
                }
            });
        });

        let customers = JSON.parse(localStorage.getItem('ncn_krathong_cust')) || {};
        let currentView = 'home';
        let selectedBranch = BRANCHES[0].id;
        let customerPhone = '';
        let adminTab = 'stock';

        function getCustomerHistoryHTML(phone) {
            let custRecord = customers[phone];
            if (!custRecord || !custRecord.history || custRecord.history.length === 0) return '';
            
            let html = '<div class="mt-4 text-left bg-purple-900/40 p-3 rounded-xl border border-purple-700/50">';
            html += '<div class="text-xs font-bold text-yellow-300 mb-2"><i class="fa-solid fa-clock-rotate-left mr-1"></i> ประวัติการลอยกระทงลุ้นโชคของคุณ:</div>';
            html += '<div class="space-y-2 max-h-40 overflow-y-auto pr-1">';
            
            custRecord.history.forEach((h, index) => {
                html += `
                    <div class="text-xs text-purple-200 bg-purple-950/60 p-2.5 rounded-lg border border-purple-800/40">
                        <div class="font-bold text-white mb-1">🎁 ครั้งที่ ${index + 1}: ${h.rewardName}</div>
                        <div class="text-[10px] text-purple-300 flex items-center mb-0.5"><i class="fa-solid fa-location-dot w-4 text-center mr-1"></i> ${h.branchName}</div>
                        <div class="text-[10px] text-yellow-300 flex items-center"><i class="fa-solid fa-clock w-4 text-center mr-1"></i> ${h.time || 'ไม่ระบุ'}</div>
                    </div>
                `;
            });
            
            html += '</div></div>';
            return html;
        }

        function showCustomAlert(title, message, callback = null) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 md:p-8 rounded-2xl max-w-sm w-full text-center glow-gold relative animate-pulse-slow">
                    <div class="text-6xl mb-3 animate-bounce">🌕</div>
                    <h3 class="text-xl font-bold text-yellow-400 mb-2">${title}</h3>
                    <div class="text-sm text-purple-200 mb-6 leading-relaxed">${message}</div>
                    <button id="alert-ok-btn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-500 text-purple-950 font-bold rounded-xl hover:from-yellow-400 hover:to-amber-400 glow-gold transition-all">เข้าใจแล้ว ✨</button>
                </div>
            `;
            document.body.appendChild(modal);

            modal.querySelector('#alert-ok-btn').addEventListener('click', () => {
                modal.remove();
                if (callback) callback();
            });
        }

        async function loadSupabaseData() {
            if (!supabaseClient) return;
            try {
                let { data: rewData } = await supabaseClient.from('loykrathong_rewards').select('*');
                if (rewData && rewData.length > 0) {
                    rewards = rewData.map(r => ({ id: r.id, name: r.name, image: r.image, weight: 15 }));
                    branchInventories = {};
                    BRANCHES.forEach(b => {
                        branchInventories[b.id] = {};
                        rewData.forEach(r => {
                            const sMap = r.stock_map || {};
                            const aMap = r.active_map || {};
                            branchInventories[b.id][r.id] = {
                                stock: sMap[b.id] !== undefined ? sMap[b.id] : 15,
                                active: aMap[b.id] !== undefined ? aMap[b.id] : true
                            };
                        });
                    });
                    localStorage.setItem('ncn_krathong_rewards', JSON.stringify(rewards));
                    localStorage.setItem('ncn_krathong_inv', JSON.stringify(branchInventories));
                }

                let { data: recData, error } = await supabaseClient.from('loykrathong_records').select('*');
                if (!error && recData) {
                    let freshCust = {};
                    recData.forEach(r => {
                        let phone = r.phone;
                        if (!freshCust[phone]) freshCust[phone] = { drawsCount: 0, history: [] };
                        let exists = freshCust[phone].history.some(h => h.id === r.id);
                        if (!exists) {
                            freshCust[phone].drawsCount += 1;
                            freshCust[phone].history.push({
                                id: r.id, rewardName: r.reward_name, branchName: r.branch_name, time: r.time || 'ไม่ระบุ'
                            });
                        }
                    });
                    customers = freshCust;
                    localStorage.setItem('ncn_krathong_cust', JSON.stringify(customers));
                }
                renderCurrentView();
            } catch (err) {}
        }

        async function saveRewardToSupabase(rewardId) {
            localStorage.setItem('ncn_krathong_rewards', JSON.stringify(rewards));
            localStorage.setItem('ncn_krathong_inv', JSON.stringify(branchInventories));
            if (!supabaseClient) return;

            const reward = rewards.find(r => r.id === rewardId);
            if (!reward) return;

            let stock_map = {}, active_map = {};
            BRANCHES.forEach(b => {
                stock_map[b.id] = branchInventories[b.id]?.[rewardId]?.stock ?? 15;
                active_map[b.id] = branchInventories[b.id]?.[rewardId]?.active ?? true;
            });

            try {
                await supabaseClient.from('loykrathong_rewards').upsert({
                    id: reward.id, name: reward.name, image: reward.image, stock_map, active_map
                });
            } catch (err) {}
        }

        if (supabaseClient) {
            supabaseClient.channel('public:loykrathong_records').on('postgres_changes', { event: '*', schema: 'public', table: 'loykrathong_records' }, () => { loadSupabaseData(); }).subscribe();
            supabaseClient.channel('public:loykrathong_rewards').on('postgres_changes', { event: '*', schema: 'public', table: 'loykrathong_rewards' }, () => { loadSupabaseData(); }).subscribe();
        }

        function renderCurrentView() {
            const container = document.getElementById('app-container');
            if (!container) return;
            const scrollY = window.scrollY;

            if (currentView === 'home') {
                container.innerHTML = renderHomeHTML();
                attachHomeEvents();
            } else if (currentView === 'draw') {
                container.innerHTML = renderDrawHTML();
            } else if (currentView === 'admin_login') {
                container.innerHTML = renderAdminLoginHTML();
                attachAdminLoginEvents();
            } else if (currentView === 'admin_dashboard') {
                container.innerHTML = renderAdminDashboardHTML();
            }
            window.scrollTo(0, scrollY);
        }

        function goToHome() {
            currentView = 'home';
            renderCurrentView();
        }

        function renderHomeHTML() {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch) || BRANCHES[0];
            const activeRewards = (rewards || []).filter(r => branchInventories[selectedBranch]?.[r.id]?.active);
            let totalStock = 0;
            activeRewards.forEach(r => totalStock += (branchInventories[selectedBranch][r.id].stock || 0));

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-gold relative">
                    <div class="absolute top-4 left-4 text-2xl">🌕</div>
                    <div class="absolute top-4 right-4 text-2xl">🌸</div>
                    
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-yellow-500/25 flex items-center justify-center text-3xl glow-gold animate-bounce">🌕</div>
                        <h2 class="text-2xl md:text-3xl font-bold text-yellow-400">ลอยกระทง เสริมดวง ลุ้นโชค</h2>
                        <p class="text-purple-300 text-sm mt-1">🌸 NCN Medgroup เทศกาลลอยกระทง 🕯️</p>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-yellow-300 mb-2">
                            <i class="fa-solid fa-store mr-2"></i> 1. เลือกร้านสาขาที่คุณเข้ารับบริการ
                        </label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            ${BRANCHES.map(b => `
                                <button type="button" onclick="selectBranch('${b.id}')" class="p-3 rounded-xl text-sm font-medium transition-all text-left truncate ${selectedBranch === b.id ? 'bg-yellow-600 text-white glow-gold font-bold' : 'bg-purple-950/60 text-purple-200 hover:bg-purple-900/60 border border-purple-800/50'}">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${b.name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="mb-6 bg-purple-950/40 p-4 rounded-xl border border-purple-800/40">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-yellow-300"><i class="fa-solid fa-gift mr-1"></i> ของรางวัลสาขา: ${branchObj.name}</span>
                            <span class="text-xs text-purple-400">คงเหลือ ${totalStock} ชิ้น</span>
                        </div>
                        <div class="marquee-container py-2">
                            <div class="marquee-track">
                                ${activeRewards.concat(activeRewards).map(r => `
                                    <div class="flex-shrink-0 w-32 bg-purple-900/40 border border-purple-700/50 rounded-xl p-3 text-center">
                                        <div class="text-3xl mb-1">${r.image}</div>
                                        <div class="text-xs font-semibold text-white truncate">${r.name}</div>
                                        <div class="text-[10px] text-yellow-300 mt-1">เหลือ ${branchInventories[selectedBranch][r.id].stock} ชิ้น</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <form id="customer-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-yellow-300 mb-1">
                                <i class="fa-solid fa-phone mr-2"></i> 2. กรอกเบอร์โทรศัพท์มือถือ (10 หลัก)
                            </label>
                            <input type="tel" id="cust-phone" maxlength="10" required placeholder="08XXXXXXXX" value="${customerPhone}" oninput="customerPhone = this.value" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white text-lg tracking-widest text-center focus:outline-none focus:border-yellow-500">
                        </div>

                        <button id="btn-submit" type="submit" class="w-full py-4 mt-2 rounded-xl bg-gradient-to-r from-yellow-500 to-amber-500 text-purple-950 font-bold text-lg hover:from-yellow-400 hover:to-amber-400 glow-gold transition-all transform hover:scale-[1.01] flex justify-center items-center">
                            ลอยกระทงเสี่ยงทายโชคลาภ 🌕 ✨
                        </button>
                    </form>

                    <div class="text-center mt-4 text-xs text-purple-300">
                        <i class="fa-solid fa-shield-halved mr-1"></i> จำกัดสิทธิ์สูงสุด 2 ครั้งต่อ 1 เบอร์โทรศัพท์ (รวมทุกสาขา)
                    </div>
                </div>
            `;
        }

        function selectBranch(id) {
            selectedBranch = id;
            renderCurrentView();
        }

        function attachHomeEvents() {
            const form = document.getElementById('customer-form');
            if (!form) return;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const phone = document.getElementById('cust-phone').value.trim();
                const phoneRegex = /^0[689]\d{8}$/;
                if (!phoneRegex.test(phone)) {
                    showCustomAlert('เบอร์โทรไม่ถูกต้อง ❌', 'กรุณากรอกหมายเลขโทรศัพท์มือถือ 10 หลักให้ถูกต้อง<br>(ขึ้นต้นด้วย 06, 08 หรือ 09)');
                    return;
                }

                const btn = document.getElementById('btn-submit');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังตรวจสอบสิทธิ์...';
                btn.disabled = true;

                let supaDraws = 0;
                let supaHistory = [];
                if (supabaseClient) {
                    try {
                        let { data } = await supabaseClient.from('loykrathong_records').select('*').eq('phone', phone);
                        if (data) {
                            supaDraws = data.length;
                            supaHistory = data.map(r => ({ id: r.id, rewardName: r.reward_name, branchName: r.branch_name, time: r.time }));
                        }
                    } catch(e) {}
                }

                customers[phone] = { drawsCount: supaDraws, history: supaHistory };
                localStorage.setItem('ncn_krathong_cust', JSON.stringify(customers));

                btn.disabled = false;
                if (supaDraws >= 2) {
                    showCustomAlert('ใช้สิทธิ์ครบแล้ว! 🚫', 'หมายเลขนี้ใช้สิทธิ์ลอยกระทงครบ 2 ครั้งแล้วครับ' + getCustomerHistoryHTML(phone));
                    return;
                }

                customerPhone = phone;
                currentView = 'draw';
                renderCurrentView();
            });
        }

        function renderDrawHTML() {
            const custRecord = customers[customerPhone] || { drawsCount: 0 };
            const remaining = Math.max(0, 2 - custRecord.drawsCount);
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);

            return `
                <div class="w-full card-glass p-6 md:p-8 rounded-2xl glow-purple text-center relative">
                    <div class="flex justify-between items-center mb-6 border-b border-purple-800/40 pb-4">
                        <div class="text-left">
                            <h3 class="font-bold text-yellow-400 text-lg">เบอร์: ${customerPhone}</h3>
                            <p class="text-xs text-purple-300">สาขาที่ลอย: ${branchObj.name}</p>
                        </div>
                        <div class="bg-purple-900/60 px-4 py-2 rounded-xl border border-yellow-500/40">
                            <span class="text-xs text-purple-300">สิทธิ์ลอยกระทง:</span>
                            <span class="text-lg font-bold text-yellow-400 ml-1">${remaining} ครั้ง</span>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-white mb-2">🌸 เลือกกระทงเสี่ยงทายสายน้ำ 🕯️</h2>
                        <p class="text-purple-300 text-sm">คลิกเลือกกระทงด้านล่างเพื่อลุ้นรับรางวัลมงคล!</p>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                        ${[1, 2, 3, 4, 5, 6].map(num => `
                            <div onclick="launchKrathong(${num})" class="card-glass p-6 rounded-2xl cursor-pointer hover:border-yellow-500 hover:glow-gold transition-all transform hover:-translate-y-1 group relative overflow-hidden">
                                <div id="loader-${num}" class="absolute inset-0 bg-black/60 z-10 hidden flex-col items-center justify-center">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl text-yellow-500 mb-2"></i>
                                    <span class="text-xs text-white">กำลังลอยกระทง...</span>
                                </div>
                                <div class="text-5xl mb-3 animate-pulse-slow group-hover:scale-110 transition-transform">🌸</div>
                                <div class="text-sm font-bold text-yellow-300">กระทงมงคล #${num}</div>
                                <div class="text-xs text-purple-400 mt-1">คลิกเพื่ออธิษฐาน</div>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="goToHome()" class="px-6 py-2 rounded-xl bg-purple-900/60 text-purple-300 hover:bg-purple-800 text-sm border border-purple-700">
                        <i class="fa-solid fa-arrow-left mr-1"></i> เปลี่ยนเบอร์ / เปลี่ยนสาขา
                    </button>
                </div>
            `;
        }

        async function launchKrathong(num) {
            const loader = document.getElementById(`loader-${num}`);
            if (loader) { loader.classList.remove('hidden'); loader.classList.add('flex'); }

            let supaDraws = 0;
            if (supabaseClient) {
                try {
                    let { data } = await supabaseClient.from('loykrathong_records').select('*').eq('phone', customerPhone);
                    if (data) supaDraws = data.length;
                } catch(e) {}
            }

            if (loader) loader.classList.add('hidden');

            if (supaDraws >= 2) {
                showCustomAlert('ใช้สิทธิ์ครบแล้ว! 🚫', 'คุณใช้สิทธิ์ครบ 2 ครั้งแล้วครับ' + getCustomerHistoryHTML(customerPhone), () => { goToHome(); });
                return;
            }

            let available = rewards.filter(r => branchInventories[selectedBranch]?.[r.id]?.active && branchInventories[selectedBranch][r.id].stock > 0);
            if (available.length === 0) {
                showCustomAlert('ของรางวัลหมด! 📦', 'ขออภัยค่ะ ของรางวัลในสาขานี้หมดเกลี้ยงแล้ว');
                return;
            }

            let totalWeight = available.reduce((sum, r) => sum + r.weight, 0);
            let rand = Math.random() * totalWeight;
            let currentSum = 0;
            let won = available[0];
            for (let r of available) {
                currentSum += r.weight;
                if (rand <= currentSum) { won = r; break; }
            }

            const modal = document.createElement('div');
            modal.id = 'anim-modal';
            modal.className = 'fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center';
            modal.innerHTML = `
                <div class="text-7xl mb-4 animate-bounce">🕯️🌊</div>
                <h3 class="text-2xl font-bold text-yellow-400 mb-2">กำลังลอยกระทงลงสู่สายน้ำ...</h3>
                <p class="text-purple-300 text-sm italic mb-6 animate-pulse">"ขอให้ผลบุญหนุนนำ โชคลาภจงบังเกิด!"</p>
                <div class="w-16 h-16 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin"></div>
            `;
            document.body.appendChild(modal);

            branchInventories[selectedBranch][won.id].stock -= 1;
            await saveRewardToSupabase(won.id);

            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const timeStr = new Date().toLocaleString('th-TH');

            if (supabaseClient) {
                try {
                    let newId = 'kr_' + Date.now() + Math.floor(Math.random() * 1000);
                    await supabaseClient.from('loykrathong_records').insert([{
                        id: newId, phone: customerPhone, branch_name: branchObj.name, reward_name: won.name, reward_image: won.image, time: timeStr
                    }]);
                    let { data } = await supabaseClient.from('loykrathong_records').select('*').eq('phone', customerPhone);
                    if (data) {
                        customers[customerPhone] = {
                            drawsCount: data.length,
                            history: data.map(r => ({ id: r.id, rewardName: r.reward_name, branchName: r.branch_name, time: r.time }))
                        };
                        localStorage.setItem('ncn_krathong_cust', JSON.stringify(customers));
                    }
                } catch(e) {}
            }

            setTimeout(() => {
                document.getElementById('anim-modal')?.remove();
                showWinPopup(won, customers[customerPhone]?.drawsCount || 1);
            }, 2000);
        }

        function showWinPopup(reward, count) {
            const branchObj = BRANCHES.find(b => b.id === selectedBranch);
            const remaining = Math.max(0, 2 - count);

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="card-glass p-6 md:p-8 rounded-2xl max-w-md w-full text-center glow-gold relative">
                    <div class="text-6xl mb-2 animate-bounce">🎉</div>
                    <h3 class="text-2xl font-bold text-yellow-400 mb-1">สาธุ! คุณได้รับรางวัล</h3>
                    <div class="my-4 p-4 bg-purple-950/60 rounded-xl border border-yellow-500/40">
                        <div class="text-5xl mb-2">${reward.image}</div>
                        <h4 class="text-xl font-bold text-white">${reward.name}</h4>
                        <p class="text-xs text-purple-300 mt-1">สาขา: ${branchObj.name}</p>
                    </div>
                    <p class="text-xs text-purple-200 mb-4">สิทธิ์ใช้ไป: <b class="text-yellow-400">${count}/2 ครั้ง</b> (เหลือ: ${remaining} ครั้ง)</p>
                    <div class="flex space-x-3">
                        ${remaining > 0 ? `<button onclick="this.closest('.fixed').remove(); currentView='draw'; renderCurrentView();" class="flex-1 py-3 bg-yellow-600 text-white rounded-xl font-bold text-sm hover:bg-yellow-500">ลอยกระทงอีก ✨</button>` : ''}
                        <button onclick="this.closest('.fixed').remove(); goToHome();" class="flex-1 py-3 bg-purple-800 text-purple-200 rounded-xl font-bold text-sm hover:bg-purple-700">เสร็จสิ้น</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            renderCurrentView();
        }

        function openAdminLogin() {
            currentView = 'admin_login';
            renderCurrentView();
        }

        function renderAdminLoginHTML() {
            return `
                <div class="w-full max-w-md card-glass p-6 md:p-8 rounded-2xl glow-gold">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto mb-2 rounded-2xl bg-yellow-500/20 flex items-center justify-center text-3xl glow-gold">👑</div>
                        <h2 class="text-2xl font-bold text-yellow-400">แอดมินส่วนกลาง</h2>
                        <p class="text-purple-300 text-xs mt-1">กรุณากรอกรหัสผ่านผู้ดูแลระบบ</p>
                    </div>
                    <form id="admin-login-form" class="space-y-4">
                        <div>
                            <input type="password" id="admin-passcode" required placeholder="รหัสผ่านส่วนกลาง" class="w-full px-4 py-3 rounded-xl bg-purple-950/80 border border-purple-700 text-white text-center focus:outline-none focus:border-yellow-500">
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-yellow-600 text-white font-bold hover:bg-yellow-500 glow-gold">เข้าสู่ระบบแอดมิน</button>
                    </form>
                    <div class="text-center mt-6">
                        <button onclick="goToHome()" class="text-xs text-purple-400 hover:text-yellow-300 underline">← กลับหน้าหลัก</button>
                    </div>
                </div>
            `;
        }

        function attachAdminLoginEvents() {
            const form = document.getElementById('admin-login-form');
            if (!form) return;
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const pass = document.getElementById('admin-passcode').value.trim();
                if (pass === 'ncpm2014') {
                    currentView = 'admin_dashboard';
                    adminTab = 'stock';
                    renderCurrentView();
                } else {
                    showCustomAlert('รหัสผ่านไม่ถูกต้อง ❌', 'กรุณาตรวจสอบรหัสผ่านส่วนกลางใหม่อีกครั้ง');
                }
            });
        }

        function setAdminTab(tab) { adminTab = tab; renderCurrentView(); }

        function renderAdminDashboardHTML() {
            let totalCust = Object.keys(customers).length;
            let totalDraws = 0;
            Object.values(customers).forEach(c => totalDraws += (c.drawsCount || 0));

            return `
                <div class="w-full card-glass p-6 rounded-2xl glow-purple">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-purple-800/40 gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-yellow-400">📊 แอดมินส่วนกลาง (ภาพรวมทุกสาขา)</h2>
                            <p class="text-xs text-purple-300">จัดการสต็อกและตรวจสอบสิทธิ์ลอยกระทง</p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="goToHome()" class="px-4 py-2 bg-purple-900 rounded-xl text-xs text-purple-200">หน้าเว็บลูกค้า</button>
                            <button onclick="goToHome()" class="px-4 py-2 bg-red-600/80 rounded-xl text-xs text-white">ออกจากระบบ</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-yellow-400 font-bold">${totalCust}</div>
                            <div class="text-xs text-purple-300 mt-1">ผู้ร่วมลอยกระทง (คน)</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-yellow-400 font-bold">${totalDraws}</div>
                            <div class="text-xs text-purple-300 mt-1">จำนวนครั้งที่ลอย</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-yellow-400 font-bold">${rewards.length}</div>
                            <div class="text-xs text-purple-300 mt-1">รายการรางวัล</div>
                        </div>
                        <div class="bg-purple-950/60 p-4 rounded-xl border border-purple-800 text-center">
                            <div class="text-2xl text-green-400 font-bold">Realtime</div>
                            <div class="text-xs text-purple-300 mt-1">สถานะระบบซิงก์</div>
                        </div>
                    </div>

                    <div class="flex space-x-2 mb-6 border-b border-purple-800/40 pb-4">
                        <button onclick="setAdminTab('stock')" class="px-5 py-2.5 rounded-xl font-bold text-sm ${adminTab === 'stock' ? 'bg-yellow-600 text-white glow-gold' : 'bg-purple-950 text-purple-300'}">จัดการสต็อกทุกสาขา</button>
                        <button onclick="setAdminTab('customers')" class="px-5 py-2.5 rounded-xl font-bold text-sm ${adminTab === 'customers' ? 'bg-yellow-600 text-white glow-gold' : 'bg-purple-950 text-purple-300'}">ประวัติลูกค้า (${totalCust})</button>
                    </div>

                    ${adminTab === 'stock' ? `
                        <div class="space-y-6">
                            ${rewards.map(r => `
                                <div class="card-glass p-5 rounded-xl border border-purple-700">
                                    <div class="flex items-center space-x-3 mb-4 pb-3 border-b border-purple-800/40">
                                        <div class="text-3xl">${r.image}</div>
                                        <h4 class="font-bold text-white text-lg">${r.name}</h4>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                                        ${BRANCHES.map(b => `
                                            <div class="bg-purple-950/80 p-3 rounded-xl border border-purple-700">
                                                <div class="text-xs text-yellow-300 mb-1">${b.name}</div>
                                                <div class="text-sm font-bold text-white mb-2">เหลือ: <span class="text-green-400">${branchInventories[b.id][r.id].stock} ชิ้น</span></div>
                                                <div class="flex space-x-1">
                                                    <button onclick="updateStock('${b.id}', '${r.id}', -1)" class="w-8 h-8 bg-red-900/60 rounded text-xs font-bold">-1</button>
                                                    <button onclick="updateStock('${b.id}', '${r.id}', 1)" class="w-8 h-8 bg-green-900/60 rounded text-xs font-bold">+1</button>
                                                    <button onclick="updateStock('${b.id}', '${r.id}', 10)" class="w-8 h-8 bg-purple-800 rounded text-xs font-bold">+10</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-purple-200">
                                <thead class="bg-purple-950 text-yellow-300 uppercase text-xs border-b border-purple-800">
                                    <tr>
                                        <th class="p-3">เบอร์โทรศัพท์</th>
                                        <th class="p-3">สิทธิ์ที่ใช้ไป</th>
                                        <th class="p-3">ประวัติรางวัล</th>
                                        <th class="p-3 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-purple-900/50">
                                    ${totalCust === 0 ? `<tr><td colspan="4" class="p-4 text-center text-purple-400">ยังไม่มีข้อมูลลูกค้า</td></tr>` : 
                                    Object.entries(customers).map(([phone, data]) => `
                                        <tr>
                                            <td class="p-3 font-mono font-bold text-yellow-300">${phone}</td>
                                            <td class="p-3">${data.drawsCount} / 2 ครั้ง</td>
                                            <td class="p-3 text-xs">${(data.history || []).map(h => `<div>🎁 ${h.rewardName} (${h.branchName})</div>`).join('')}</td>
                                            <td class="p-3 text-center">
                                                <button onclick="resetCust('${phone}')" class="px-3 py-1 bg-amber-600 text-white rounded text-xs">รีเซ็ต (0)</button>
                                                <button onclick="deleteCust('${phone}')" class="px-3 py-1 bg-red-600 text-white rounded text-xs ml-1">ลบ</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            `;
        }

        async function updateStock(bId, rId, amt) {
            branchInventories[bId][rId].stock = Math.max(0, branchInventories[bId][rId].stock + amt);
            renderCurrentView();
            await saveRewardToSupabase(rId);
        }

        async function resetCust(phone) {
            if (confirm(`รีเซ็ตสิทธิ์ของเบอร์ ${phone}?`)) {
                delete customers[phone];
                localStorage.setItem('ncn_krathong_cust', JSON.stringify(customers));
                if (supabaseClient) await supabaseClient.from('loykrathong_records').delete().eq('phone', phone);
                renderCurrentView();
            }
        }

        async function deleteCust(phone) {
            if (confirm(`ลบประวัติเบอร์ ${phone}?`)) {
                delete customers[phone];
                localStorage.setItem('ncn_krathong_cust', JSON.stringify(customers));
                if (supabaseClient) await supabaseClient.from('loykrathong_records').delete().eq('phone', phone);
                renderCurrentView();
            }
        }

        renderCurrentView();
        loadSupabaseData();
    </script>
</body>
</html>
